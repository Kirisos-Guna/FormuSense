name: Publish the static site

# The application is a Python server, so Pages cannot run it. This publishes the
# project page and the slide deck, which are static, and the page says plainly
# that the app itself runs locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/index.html _site/index.html
          # The deck is generated by `python run.py --slides --preview`; copy it
          # rather than keeping a second copy in the repository to drift.
          cp report/Technostatic_Wings_FormuSense_Slides.html _site/slides.html
          test -s _site/index.html
          test -s _site/slides.html
      # Deliberately no `enablement: true`: creating a Pages site needs repository
      # administration rights, which the workflow's GITHUB_TOKEN never has, so the
      # create call fails with "Resource not accessible by integration" and the job
      # goes red for a reason that reads like a bug in the site. Pages is switched on
      # once by hand instead - Settings -> Pages -> Build and deployment -> Source:
      # GitHub Actions - and after that this step is only a lookup that succeeds.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
