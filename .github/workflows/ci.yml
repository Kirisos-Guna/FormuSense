name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suite (stdlib only, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert the standard library is enough
        # The whole point of the offline story: nothing is installed before the
        # suite runs, so a stray third-party import fails the build.
        run: python -c "import sys; print(sys.version)"

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Seed the demonstration cases
        run: python run.py --seed

      - name: Benchmark smoke test
        # The agent must still beat one-factor-at-a-time on the seeded cases.
        run: |
          python - <<'PY'
          from app.benchmark import run_benchmark
          report = run_benchmark(max_trials=4, include_conflict=True)
          summary = report["summary"]
          print(summary)
          assert summary["agent_successes"] > summary["ofat_successes"], summary
          assert summary["agent_mean_trials_to_target"] < summary["ofat_mean_trials_to_target"], summary
          assert report["conflict_demonstration"]["conflicts"], "the infeasible brief must be reported"
          PY

  learning:
    name: Dataset and model training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the acceptance dataset
        run: python run.py --build-dataset --variants 20

      - name: Train and evaluate the acceptance model
        run: python run.py --train

      - name: Print the model report
        run: python run.py --train-report

  postgres:
    name: PostgreSQL round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formu
          POSTGRES_PASSWORD: formu
          POSTGRES_DB: formusense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formu" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PostgreSQL driver
        run: pip install "psycopg[binary]"

      - name: Wait for the server to accept connections
        # The service container has a health check, and this job has still gone red
        # once with the database code unchanged, which points at the server not being
        # reachable yet. Waiting here costs a few seconds and removes the guesswork.
        env:
          FORMUSENSE_DB_URL: postgresql://formu:formu@localhost:5432/formusense
        run: |
          python - <<'PY'
          import os, time
          import psycopg
          for attempt in range(1, 21):
              try:
                  with psycopg.connect(os.environ["FORMUSENSE_DB_URL"], connect_timeout=5):
                      print(f"the server accepted a connection on attempt {attempt}")
                      break
              except Exception as exc:
                  print(f"attempt {attempt}: {type(exc).__name__}: {exc}")
                  time.sleep(3)
          else:
              raise SystemExit("the PostgreSQL service never accepted a connection")
          PY

      - name: Write and read back every kind of record on PostgreSQL
        # --db-check names the operation that failed and prints its traceback last.
        # The wrapper quotes that tail into a check annotation, because a job log needs
        # authentication to open and an annotation does not - and a failure nobody can
        # read is a failure nobody can fix.
        env:
          FORMUSENSE_DB_URL: postgresql://formu:formu@localhost:5432/formusense
        run: |
          set +e
          python run.py --db-check > dbcheck.log 2>&1
          status=$?
          cat dbcheck.log
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 3500 dbcheck.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=The record layer failed on PostgreSQL::$detail"
          fi
          exit "$status"

      - name: Run the database layer tests
        env:
          FORMUSENSE_TEST_POSTGRES: postgresql://formu:formu@localhost:5432/formusense
        run: python -m unittest tests.test_db -v

      - name: Run the seeded loop on PostgreSQL
        # The check above walks the record layer's operations one at a time; this
        # drives the application itself - the agent, the plant and the benchmark's
        # inserts - so a dialect difference that only shows up in the whole loop
        # fails here instead of in a deployment.
        env:
          FORMUSENSE_DB_URL: postgresql://formu:formu@localhost:5432/formusense
        run: python run.py --seed
